<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
  "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="en" lang="en">
<head>
    <title>profile.html</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" type="text/css" href="styles.css" />
</head>
<body>

    <div id="page-wrapper">

        <div id="profile-card" class="card">

            <span class="badge">Pro Member</span>

            <div class="image-wrapper">
                <img src="images/avatar.png" alt="Profile photo of user" class="profile-img" />
                <span class="deco-icon">&#9733;</span>
            </div>

            <div class="card-content">
                <h1 id="profile-name">Jane Doe</h1>
                <p class="profile-role">Frontend Developer &amp; Designer</p>
                <p id="profile-bio" class="bio">
                    Passionate about crafting clean, accessible interfaces and
                    turning complex problems into simple, elegant designs.
                    Coffee enthusiast, lifelong learner, and open-source
                    contributor.
                </p>

                <ul class="profile-stats">
                    <li><strong>128</strong><span>Projects</span></li>
                    <li><strong>4.2k</strong><span>Followers</span></li>
                    <li><strong>312</strong><span>Following</span></li>
                </ul>
            </div>

        </div>

    </div>

</body>
</html>
